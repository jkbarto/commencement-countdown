<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commencement 27 Portrait Countdown</title>
<style>
:root {
  --green:#046A38;
  --gold:#C99700;
  --black:#101820;
  --black-top:#1b252d;
  --black-bottom:#0c1318;
  --white:#f7f7f2;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--green);}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:white;
  overflow:hidden;
  /* Anti-aliasing fixes to ensure crisp text on a 1080p 32-inch TV screen */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.screen {
  width:100vw;
  height:100vh;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:0;
  padding:3vh 4vw 3vh;
  background:var(--green);
}

.nova {
  text-align:center;
  font-weight:800;
  letter-spacing:.14em;
  font-size:clamp(18px,2.2vw,42px);
  line-height:1.15;
}
.nova span {
  display:block;
  margin-top:.55em;
  font-size:.48em;
  letter-spacing:.24em;
  font-weight:700;
}

.logo-wrap {
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-top:1vh;
}
.logo-wrap img {
  display:block;
  width:min(90vw,950px);
  height:auto;
}

.countdown {
  width:100%;
  display:grid;
  grid-template-columns:1.18fr .92fr .92fr .92fr;
  gap:1.2vw;
  align-items:center;
  justify-items:center;
}

.unit {text-align:center;width:100%;}
.digits {
  display:flex;
  justify-content:center;
  gap:.55vw;
}

.flip-card {
  position:relative;
  width:clamp(48px,7.25vw,88px);
  height:clamp(66px,9.4vw,114px);
  perspective:1400px;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.30));
}
.card-half,.flip-half {
  position:absolute;left:0;width:100%;height:50%;overflow:hidden;
  backface-visibility:hidden;color:var(--white);background:var(--black);
}
.card-half.top,.flip-half.top {
  top:0;border-radius:12px 12px 2px 2px;
  background:linear-gradient(180deg,var(--black-top),var(--black));
  border-bottom:1px solid #05090c;
}
.card-half.bottom,.flip-half.bottom {
  bottom:0;border-radius:2px 2px 12px 12px;
  background:linear-gradient(180deg,var(--black),var(--black-bottom));
  border-top:1px solid rgba(255,255,255,.03);
}
.card-half span,.flip-half span {
  position:absolute;left:0;width:100%;height:200%;
  display:flex;align-items:center;justify-content:center;
  font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
  font-size:clamp(43px,7.05vw,84px);font-weight:800;line-height:1;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #000;
}
.top span{top:0} .bottom span{bottom:0}
.flip-half.top{z-index:6;transform-origin:bottom}
.flip-half.bottom{z-index:5;transform-origin:top;transform:rotateX(90deg)}
.flip-card.flipping .flip-half.top{animation:flipTop .28s cubic-bezier(.55,.05,.85,.35) forwards}
.flip-card.flipping .flip-half.bottom{animation:flipBottom .28s .28s cubic-bezier(.15,.45,.25,1) forwards}
@keyframes flipTop{0%{transform:rotateX(0);filter:brightness(1)}100%{transform:rotateX(-90deg);filter:brightness(.62)}}
@keyframes flipBottom{0%{transform:rotateX(90deg);filter:brightness(.62)}100%{transform:rotateX(0);filter:brightness(1)}}
.seam {
  position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-1px);
  background:#06090b;box-shadow:0 1px 0 rgba(255,255,255,.05);z-index:10;
}
.label {
  margin-top:1.2vh;font-size:clamp(11px,1.75vw,24px);
  font-weight:800;letter-spacing:.18em;
  color:var(--gold);
}

.date-row {
  width:100%;display:flex;align-items:center;gap:2.5vw;
}
.rule{flex:1;height:5px;background:var(--gold)}
.date {
  white-space:nowrap;text-align:center;font-size:clamp(26px,4vw,54px);
  line-height:1;font-weight:800;letter-spacing:.015em;
}
.tagline {
  margin-top:auto;
  margin-bottom:1vh;
  font-size:clamp(18px,2.2vw,32px);
  letter-spacing:.12em;text-transform:uppercase;font-weight:700;text-align:center;
}
.year-mark {
  font-size:clamp(100px,22vw,270px);
  font-weight:900;
  line-height:.82;
  letter-spacing:-.06em;
  color:rgba(255,255,255,.07);
  margin-top:2vh;
  user-select:none;
}
.sr-only {
  position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
  margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;border:0!important;
}

/* Optimized specifically for a portrait 9:16 display */
@media (orientation:portrait) {
  .screen{padding-left:5vw;padding-right:5vw}
}

/* Portrait TV poster layout — actual supplied logos + original live countdown */
.screen{
  position:relative;
  justify-content:flex-start;
  padding:2.7vh 4vw 0;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 76%, rgba(201,151,0,.18), transparent 16%),
    radial-gradient(circle at 82% 72%, rgba(255,255,255,.07), transparent 17%),
    linear-gradient(180deg,#075f35 0%,#004b2b 52%,#003b25 100%);
}

/* Adjusted gold stripe placement to avoid colliding with top branding */
.screen::before{
  content:"";
  position:absolute;
  left:-10vw; right:-10vw; top:16vh;
  height:3px;
  background:var(--gold);
  transform:rotate(-7deg);
  opacity:.9;
}
.official-nova{
  position:relative;
  z-index:3;
  width:100%;
  min-height:10vh;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:2vh;
  background:white;
  border-radius:8px;
  padding:1.4vh 2.5vw;
}
.official-nova img{
  display:block;
  width:min(88vw,1000px);
  height:auto;
}
.logo-wrap{
  position:relative;
  z-index:3;
  margin:1vh 0 3.6vh;
}
.logo-wrap img{
  width:min(94vw,1080px);
}
.countdown{
  position:relative;
  z-index:4;
  margin:0 0 3.5vh;
  grid-template-columns:1.18fr .92fr .92fr .92fr;
  gap:1vw;
}
.flip-card{
  width:clamp(50px,7.3vw,92px);
  height:clamp(68px,9.5vw,120px);
}
.card-half span,.flip-half span{
  color:#f2c14e;
  font-size:clamp(45px,7.1vw,88px);
}
.label{
  color:white;
  margin-top:1vh;
  font-size:clamp(11px,1.7vw,23px);
}
.date-row{
  position:relative;
  z-index:4;
  margin-bottom:1vh;
}
.date{
  font-size:clamp(28px,4.1vw,58px);
}
.rule{height:4px;}
.lower-art{
  position:relative;
  z-index:1;
  flex:1;
  width:100%;
  min-height:20vh;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
}
.lower-art::before{
  content:"";
  position:absolute;
  left:-8vw;
  bottom:-8vh;
  width:75vw;
  height:32vh;
  background:linear-gradient(145deg,rgba(8,15,18,.95),rgba(8,15,18,.55));
  clip-path:polygon(0 34%,68% 0,100% 42%,73% 55%,73% 100%,0 100%);
}
.lower-art img{
  position:absolute;
  right:-9vw;
  bottom:-3vh;
  width:min(62vw,700px);
  opacity:.14;
  mix-blend-mode:screen;
  filter:saturate(.6);
}
.tagline,.year-mark,.nova{display:none!important;}


/* --- Top + bottom refinement only --- */

/* Let the official logo breathe without looking like a white card pasted on top. */
.official-nova{
  min-height:0 !important;
  width:94% !important;
  margin:0 auto 2.2vh !important;
  padding:1.15vh 2.8vw !important;
  border-radius:0 !important;
  background:#fff !important;
  box-shadow:0 5px 18px rgba(0,0,0,.10);
}
.official-nova img{
  width:min(80vw,900px) !important;
}

/* Turn the lower area into a cleaner branded finish instead of a large dark shape. */
.lower-art{
  margin-top:1.5vh !important;
  min-height:22vh !important;
  align-items:center !important;
  justify-content:center !important;
  overflow:hidden !important;
  border-top:3px solid rgba(201,151,0,.9);
}
.lower-art::before{
  left:0 !important;
  right:0 !important;
  bottom:0 !important;
  width:100% !important;
  height:100% !important;
  background:
    radial-gradient(circle at 50% 120%, rgba(201,151,0,.18), transparent 48%),
    linear-gradient(180deg,rgba(0,59,37,.05),rgba(0,35,24,.58)) !important;
  clip-path:none !important;
}
.lower-art img{
  right:50% !important;
  bottom:50% !important;
  transform:translate(50%,50%) !important;
  width:min(46vw,520px) !important;
  max-height:19vh !important;
  object-fit:contain !important;
  opacity:.16 !important;
  mix-blend-mode:screen !important;
  filter:saturate(.7) contrast(1.05) !important;
}

/* White NOVA logo directly on green — no white panel. Clean finish. */
.official-nova{
  background:transparent !important;
  box-shadow:none !important;
  padding:.6vh 2vw !important;
  width:94% !important;
  margin:0 auto 2.2vh !important;
}
.official-nova img {
  width: min(80vw, 900px) !important;
  display: block;
  margin: 0 auto;
  /* Note: If your image asset is a dark color, uncomment the line below to turn it white */
  /* filter: brightness(0) invert(1); */
}
</style>
</head>
<body>

<div class="screen">
  <!-- Top Institutional Logo Panel -->
  <div class="official-nova">
    <img src="nova-logo.png" alt="Northern Virginia Community College Logo">
  </div>

  <!-- Main Event Graphic Headline -->
  <div class="logo-wrap">
    <img src="commencement-title.png" alt="Commencement 2027 Title Graphic">
  </div>

  <!-- 3D Flip Clock Grid System -->
  <div class="countdown" id="countdown-board">
    <!-- Days Group -->
    <div class="unit">
      <div class="digits">
        <div class="flip-card" id="d1">
          <div class="card-half top"><span>0</span></div>
          <div class="card-half bottom"><span>0</span></div>
          <div class="seam"></div>
        </div>
        <div class="flip-card" id="d2">
          <div class="card-half top"><span>0</span></div>
          <div class="card-half bottom"><span>0</span></div>
          <div class="seam"></div>
        </div>
      </div>
      <div class="label">DAYS</div>
    </div>

    <!-- Hours Group -->
    <div class="unit">
      <div class="digits">
        <div class="flip-card" id="h1">
          <div class="card-half top"><span>0</span></div>
          <div class="card-half bottom"><span>0</span></div>
          <div class="seam"></div>
        </div>
        <div class="flip-card" id="h2">
