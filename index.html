<div class="date-row">
  <span class="rule"></span>
  <div class="date" id="dateLine">MAY 18, 2027 • 11:00 AM</div>
  <span class="rule"></span>
</div>

<div class="sr-only" id="srStatus" role="timer" aria-live="polite"></div>
</section>

<script>
const target = new Date("2027-05-18T11:00:00-04:00").getTime();
const widths = {days:3,hours:2,minutes:2,seconds:2};
const groups = {};

function createCard(initial){
  const card = document.createElement("div");
  card.className = "flip-card";
  card.dataset.value = initial;
  card.innerHTML = `
    <div class="card-half top static-top"><span>${initial}</span></div>
    <div class="card-half bottom static-bottom"><span>${initial}</span></div>
    <div class="flip-half top flip-top"><span>${initial}</span></div>
    <div class="flip-half bottom flip-bottom"><span>${initial}</span></div>
    <div class="seam"></div>`;
  return card;
}

for(const [name,width] of Object.entries(widths)){
  const host = document.getElementById(name);
  groups[name] = [];
  for(let i=0;i<width;i++){
    const card = createCard("0");
    host.appendChild(card);
    groups[name].push(card);
  }
}

function snap(card,value){
  card.dataset.value = value;
  card.querySelectorAll("span").forEach(s=>s.textContent=value);
}

function flip(card,next){
  const current = card.dataset.value;
  if(current === next) return;

  const staticTop = card.querySelector(".static-top span");
  const staticBottom = card.querySelector(".static-bottom span");
  const flipTop = card.querySelector(".flip-top span");
  const flipBottom = card.querySelector(".flip-bottom span");

  staticTop.textContent = next;
  staticBottom.textContent = current;
  flipTop.textContent = current;
  flipBottom.textContent = next;

  card.classList.remove("flipping");
  void card.offsetWidth;
  card.classList.add("flipping");

  setTimeout(()=>{ staticBottom.textContent = next; }, 280);

  setTimeout(()=>{
    card.classList.remove("flipping");
    snap(card,next);
  }, 590);
}

function remaining(){
  let diff = Math.max(0,target-Date.now());
  const days = Math.floor(diff/86400000); diff %= 86400000;
  const hours = Math.floor(diff/3600000); diff %= 3600000;
  const minutes = Math.floor(diff/60000); diff %= 60000;
  const seconds = Math.floor(diff/1000);

  return {
    days:String(days).padStart(3,"0"),
    hours:String(hours).padStart(2,"0"),
    minutes:String(minutes).padStart(2,"0"),
    seconds:String(seconds).padStart(2,"0")
  };
}

function render(initial=false){
  const vals = remaining();

  for(const [name,str] of Object.entries(vals)){
    groups[name].forEach((card,i)=>initial ? snap(card,str[i]) : flip(card,str[i]));
  }

  const sr = document.getElementById("srStatus");
  if(Date.now() >= target){
    document.getElementById("dateLine").textContent = "COMMENCEMENT DAY IS HERE";
    sr.textContent = "Commencement Day is here.";
  } else {
    const key = vals.days+"-"+vals.hours+"-"+vals.minutes;
    if(sr.dataset.key !== key){
      sr.dataset.key = key;
      sr.textContent =
        `${parseInt(vals.days)} days, ${parseInt(vals.hours)} hours, ` +
        `${parseInt(vals.minutes)} minutes until Commencement on May 18, 2027 at 11:00 AM.`;
    }
  }
}

render(true);
setInterval(()=>render(false),1000);
</script>
</body>
</html>
