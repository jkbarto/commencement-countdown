<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commencement 27 Live Countdown</title>
<style>
:root{
  --green:#046A38;
  --gold:#C99700;
  --black:#101820;
  --black-top:#1b252d;
  --black-bottom:#0c1318;
  --white:#f7f7f2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;line-height:1;display:block;height:max-content}

.banner{
  width:100%;
  max-width:2048px;
  margin:0 auto;
  box-sizing:border-box;
  padding:0 64px 18px;
  background:var(--green);
  color:white;
  overflow:hidden;
  margin-bottom:0;
}

.logo-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:-22px 0 0;
}
.logo-wrap img{
  display:block;
  width:min(1320px,66%);
  height:auto;
}

.countdown{
  display:grid;
  margin-top:-18px;
  grid-template-columns:1.18fr .92fr .92fr .92fr;
  gap:clamp(54px,5vw,118px);
  align-items:start;
}
.unit{text-align:center}

.digits{
  display:flex;
  justify-content:center;
  gap:12px;
}

.flip-card{
  position:relative;
  width:clamp(92px,7.75vw,160px);
  height:clamp(118px,10vw,205px);
  perspective:1400px;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.30));
}

.card-half,
.flip-half{
  position:absolute;
  left:0;
  width:100%;
  height:50%;
  overflow:hidden;
  backface-visibility:hidden;
  color:var(--white);
  background:var(--black);
}

.card-half.top,
.flip-half.top{
  top:0;
  border-radius:10px 10px 2px 2px;
  background:linear-gradient(180deg,var(--black-top),var(--black));
  border-bottom:1px solid #05090c;
}

.card-half.bottom,
.flip-half.bottom{
  bottom:0;
  border-radius:2px 2px 10px 10px;
  background:linear-gradient(180deg,var(--black),var(--black-bottom));
  border-top:1px solid rgba(255,255,255,.03);
}

.card-half span,
.flip-half span{
  position:absolute;
  left:0;
  width:100%;
  height:200%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
  font-size:clamp(82px,8.2vw,150px);
  font-weight:800;
  line-height:1;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
  text-shadow:0 2px 0 #000;
}

.top span{top:0}
.bottom span{bottom:0}

.flip-half.top{
  z-index:6;
  transform-origin:bottom;
}
.flip-half.bottom{
  z-index:5;
  transform-origin:top;
  transform:rotateX(90deg);
}

.flip-card.flipping .flip-half.top{
  animation:flipTop .28s cubic-bezier(.55,.05,.85,.35) forwards;
}
.flip-card.flipping .flip-half.bottom{
  animation:flipBottom .28s .28s cubic-bezier(.15,.45,.25,1) forwards;
}

@keyframes flipTop{
  0%{transform:rotateX(0deg);filter:brightness(1)}
  100%{transform:rotateX(-90deg);filter:brightness(.62)}
}
@keyframes flipBottom{
  0%{transform:rotateX(90deg);filter:brightness(.62)}
  100%{transform:rotateX(0deg);filter:brightness(1)}
}

.seam{
  position:absolute;
  left:0;right:0;top:50%;
  height:2px;
  transform:translateY(-1px);
  background:#06090b;
  box-shadow:0 1px 0 rgba(255,255,255,.05);
  z-index:10;
  pointer-events:none;
}

.label{
  margin-top:14px;
  font-size:clamp(18px,1.65vw,34px);
  font-weight:800;
  letter-spacing:.18em;
  color:#fff;
}

.date-row{
  display:flex;
  align-items:center;
  gap:28px;
  margin-top:18px;
}
.rule{
  flex:1;
  height:5px;
  background:var(--gold);
}
.date{
  flex:0 0 auto;
  margin-bottom:0;
  white-space:nowrap;
  font-size:clamp(28px,3vw,58px);
  line-height:1;
  font-weight:800;
  letter-spacing:.015em;
  color:white;
}

.sr-only{
  position:absolute!important;
  width:1px!important;height:1px!important;
  padding:0!important;margin:-1px!important;
  overflow:hidden!important;clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;border:0!important;
}

@media(max-width:1100px){
  .banner{padding:0 38px 14px}
  .countdown{gap:34px}
  .digits{gap:8px}
  .date-row{margin-top:16px;gap:18px}
}
@media(max-width:760px){
  .logo-wrap{margin-top:-14px}
  .banner{padding:0 14px 12px}
  .logo-wrap img{width:min(700px,68%)}
  .countdown{gap:12px}
  .digits{gap:5px}
  .label{font-size:12px;letter-spacing:.12em}
  .date-row{margin-top:14px}
}
@media(max-width:560px){
  .countdown{grid-template-columns:repeat(2,1fr);gap:18px 24px}
  .logo-wrap img{width:min(520px,86%)}
  .rule{display:none}
  .date-row{justify-content:center}
  .date{white-space:normal;text-align:center}
}
</style>
</head>

  </div>

  <div class="countdown" aria-hidden="true">
    <div class="unit"><div class="digits" id="days"></div><div class="label">DAYS</div></div>
    <div class="unit"><div class="digits" id="hours"></div><div class="label">HOURS</div></div>
    <div class="unit"><div class="digits" id="minutes"></div><div class="label">MINUTES</div></div>
    <div class="unit"><div class="digits" id="seconds"></div><div class="label">SECONDS</div></div>
  </div>

  <div class="date-row">
    <span class="rule"></span>
    <div class="date" id="dateLine">MAY 15, 2027 • 11:00 AM</div>
    <span class="rule"></span>
  </div>

  <div class="sr-only" id="srStatus" role="timer" aria-live="polite"></div>
</section>

<script>
const target = new Date("2027-05-15T11:00:00-04:00").getTime();
const widths = {days:3,hours:2,minutes:2,seconds:2};
const groups = {};

function createCard(initial){
  const card = document.createElement("div");
  card.className = "flip-card";
  card.dataset.value = initial;
  card.innerHTML = `
    <div class="card-half top static-top"><span>${initial}</span></div>
    <div class="card-half bottom static-bottom"><span>${initial}</span></div>
    <div class="flip-half top flip-top"><span>${initial}</span></div>
    <div class="flip-half bottom flip-bottom"><span>${initial}</span></div>
    <div class="seam"></div>`;
  return card;
}

for(const [name,width] of Object.entries(widths)){
  const host = document.getElementById(name);
  groups[name] = [];
  for(let i=0;i<width;i++){
    const card = createCard("0");
    host.appendChild(card);
    groups[name].push(card);
  }
}

function snap(card,value){
  card.dataset.value = value;
  card.querySelectorAll("span").forEach(s=>s.textContent=value);
}

function flip(card,next){
  const current = card.dataset.value;
  if(current === next) return;

  const staticTop = card.querySelector(".static-top span");
  const staticBottom = card.querySelector(".static-bottom span");
  const flipTop = card.querySelector(".flip-top span");
  const flipBottom = card.querySelector(".flip-bottom span");

  staticTop.textContent = next;
  staticBottom.textContent = current;
  flipTop.textContent = current;
  flipBottom.textContent = next;

  card.classList.remove("flipping");
  void card.offsetWidth;
  card.classList.add("flipping");

  setTimeout(()=>{ staticBottom.textContent = next; }, 280);

  setTimeout(()=>{
    card.classList.remove("flipping");
    snap(card,next);
  }, 590);
}

function remaining(){
  let diff = Math.max(0,target-Date.now());
  const days = Math.floor(diff/86400000); diff %= 86400000;
  const hours = Math.floor(diff/3600000); diff %= 3600000;
  const minutes = Math.floor(diff/60000); diff %= 60000;
  const seconds = Math.floor(diff/1000);

  return {
    days:String(days).padStart(3,"0"),
    hours:String(hours).padStart(2,"0"),
    minutes:String(minutes).padStart(2,"0"),
    seconds:String(seconds).padStart(2,"0")
  };
}

function render(initial=false){
  const vals = remaining();

  for(const [name,str] of Object.entries(vals)){
    groups[name].forEach((card,i)=>initial ? snap(card,str[i]) : flip(card,str[i]));
  }

  const sr = document.getElementById("srStatus");
  if(Date.now() >= target){
    document.getElementById("dateLine").textContent = "COMMENCEMENT DAY IS HERE";
    sr.textContent = "Commencement Day is here.";
  } else {
    const key = vals.days+"-"+vals.hours+"-"+vals.minutes;
    if(sr.dataset.key !== key){
      sr.dataset.key = key;
      sr.textContent =
        `${parseInt(vals.days)} days, ${parseInt(vals.hours)} hours, ` +
        `${parseInt(vals.minutes)} minutes until Commencement on May 15, 2027 at 11:00 AM.`;
    }
  }
}

render(true);
setInterval(()=>render(false),1000);
</script>
